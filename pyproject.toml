[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landfuse"
version = "0.3.0"
description = "Land-cover classification from NAIP imagery, optionally fused with terrain or LiDAR"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "LandFuse contributors"}]
keywords = ["gis", "naip", "lidar", "land-cover", "cog"]
dependencies = ["numpy>=1.26", "rasterio>=1.3", "scikit-learn>=1.3", "joblib>=1.3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
landfuse = "landfuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
